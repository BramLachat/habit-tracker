<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <title>habit-tracker-pwa</title>

  <base href="/" />

  <!-- This meta viewport ensures the webpage's dimensions change according to the device it's on. This is called Responsive Web Design.-->
  <meta name="viewport"
    content="viewport-fit=cover, width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=5.0" />
  <meta name="description" content="This is a habit-tracker-pwa app" />

  <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#181818" />
  <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f3f3f3" />

  <!-- These meta tags are Apple-specific, and set the web application to run in full-screen mode with a black status bar. Learn more at https://developer.apple.com/library/archive/documentation/AppleApplications/Reference/SafariHTMLRef/Articles/MetaTags.html-->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="habit-tracker-pwa" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black" />

  <!-- This tag is used by the habit-tracker-pwa CLI to identify template projects. Don't remove if you are using the CLI. -->
  <meta name="pwa-starter-template-identity" content="pwa-starter"/>

  <!-- Imports an icon to represent the document. -->
  <link rel="icon" href="/assets/icons/icon_24.png" type="image/png" />

  <!-- Imports the manifest to represent the web application. A web app must have a manifest to be a PWA. -->
  <link rel="manifest" href="manifest.json" />

  <!-- light mode and dark mode CSS -->
  <link rel="stylesheet" media="(prefers-color-scheme:light)"
    href="https://cdn.jsdelivr.net/npm/@shoelace-style/shoelace@2.16.0/dist/themes/light.css">
  <link rel="stylesheet" media="(prefers-color-scheme:dark)"
    href="https://cdn.jsdelivr.net/npm/@shoelace-style/shoelace@2.16.0/dist/themes/dark.css"
    onload="document.documentElement.classList.add('sl-theme-dark');">

  <script type="module">
    import { setBasePath } from '@shoelace-style/shoelace/dist/utilities/base-path.js';
    setBasePath('https://cdn.jsdelivr.net/npm/@shoelace-style/shoelace@2.16.0/cdn/');
  </script>

  <!-- Styles -->
  <link rel="stylesheet" href="./pico.css">
  <link rel="stylesheet" href="./custom.css">

  <script type="module" src="./localforage.js"></script>
  <script type="module" src="./store.js"></script>
  <script type="module" defer src="./main.js"></script>
</head>

<body>
  <script>
    if ('serviceWorker' in navigator) {
      window.onload = () => {
        navigator.serviceWorker.register(
          '/sw.js'
        );
      }
    }
  </script>

  <div class="navigation_buttons_grid container-fluid">
      <button id="DATA_NAVIGATION_BUTTON" class="secondary">Data</button>
      <button id="HABITS_NAVIGATION_BUTTON" class="secondary">Habits</button>
      <button id="COPY_TO_CLIPBOARD_BUTTON" class="secondary">Copy to clipboard</button>
  </div>

  <section id="HABITS_SECTION">
      <div id="HABIT_BUTTONS" class="buttons_grid container-fluid"></div>
      <div id="CUSTOM_HABIT" class="custom_habit_grid container-fluid">
          <textarea id="CUSTOM_HABIT_TEXT_AREA"></textarea>
          <button id="CUSTOM_HABIT_ADD_BUTTON" class="secondary">Add</button>
      </div>
  </section>

  <section id="DATA_SECTION">
      <table>
          <thead>
          <tr>
              <th>Test</th>
              <th>Description</th>
              <th>Action</th>
          </tr>
          </thead>
          <tbody id="HABIT_DATA_TABLE_BODY"></tbody>
      </table>
  </section>

  <section id="EDIT_HABIT_SECTION">
      <div class="container-fluid">
          <label>Timestamp
              <input id="EDIT_HABIT_TIMESTAMP" type="datetime-local"/>
          </label>
          <label>Description
              <textarea id="EDIT_HABIT_TEXT_AREA"></textarea>
          </label>
          <button id="EDIT_HABIT_SAVE_BUTTON" class="secondary container-fluid">Confirm</button>
      </div>
  </section>

</body>

</html>
